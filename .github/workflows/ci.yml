name: Anatomy Atlas CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anatomy-atlas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web / Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use public npm registry
        run: npm config set registry https://registry.npmjs.org/
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - name: Build Next.js
        run: npm run build:next
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
          NEXT_TELEMETRY_DISABLED: 1

  edge-functions:
    name: Supabase Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check supabase/functions
      - run: deno test --allow-read supabase/functions/tests

  database:
    name: Supabase Database
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db

  android-arm64:
    name: Android arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore Android platform files
        run: flutter create --platforms=android --project-name anatomy_atlas --org com.anatomyatlas .
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test
      - name: Build release arm64 APK
        run: flutter build apk --release --target-platform android-arm64 --dart-define=AI_PROVIDER_MODE=disabled
      - uses: actions/upload-artifact@v4
        with:
          name: anatomy-atlas-arm64-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
