project_id = "anatomy-atlas"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/admin", "anatomyatlas://auth/callback"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "500MiB"

[functions.owner-settings]
verify_jwt = true

[functions.owner-transfer]
verify_jwt = true

[functions.ai-tutor]
verify_jwt = true
