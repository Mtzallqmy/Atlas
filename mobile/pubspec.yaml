name: anatomy_atlas
publish_to: none
description: Offline-first interactive medical anatomy atlas.
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^3.0.3
  go_router: ^16.2.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  dio: ^5.9.0
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_secure_storage: ^10.0.0
  cached_network_image: ^3.4.1
  supabase_flutter: ^2.10.0
  interactive_3d: ^2.2.0
  crypto: ^3.0.6
  connectivity_plus: ^6.1.4
  archive: ^4.0.7
  collection: ^1.19.1
  uuid: ^4.5.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.1
  freezed: ^3.2.0
  json_serializable: ^6.11.0
  drift_dev: ^2.28.2
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/models/heart.glb
    - assets/images/heart.webp
    - assets/data/core_content.json
